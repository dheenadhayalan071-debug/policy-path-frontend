<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Manifest & Favicons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/parliament-emblem.png" />
    <link rel="apple-touch-icon" href="/parliament-emblem.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Browser Theme Colors (Light & Dark Mode) -->
    <meta
      name="theme-color"
      content="#FFFFFF"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1A2332"
      media="(prefers-color-scheme: dark)"
    />

    <!-- 1.2 Typography System: Inter Only -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent Theme Flash Before React Mounts -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("pp_theme");
          if (savedTheme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO -->
    <title>PolicyPath AI | Your Free AI Mentor for UPSC</title>
    <meta
      name="description"
      content="Lakhs aspirants ke saath aap bhi UPSC ki tayyari karo — bilkul free. Learn Indian Polity, Economy, and GS with PolicyPath AI."
    />
    <meta
      name="keywords"
      content="PolicyPath AI, Constitution of India, Indian Polity, UPSC mentor, civics, political science, AI education"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="PolicyPath AI | Your Free AI Mentor for UPSC" />
    <meta
      property="og:description"
      content="Lakhs aspirants ke saath aap bhi UPSC ki tayyari karo — bilkul free."
    />
    <meta property="og:image" content="/parliament-emblem.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://policy-path-theta.vercel.app/" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3NCZQYKJ9R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-3NCZQYKJ9R");
    </script>
  </head>

  <body class="bg-[#FFFFFF] text-[#4B5563] antialiased selection:bg-[#FF6B00]/15 selection:text-[#FF6B00]">
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>

    <!-- Register Offline Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.warn("SW registration skipped:", err);
          });
        });
      }
    </script>
  </body>
</html>
